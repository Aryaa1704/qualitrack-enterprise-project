<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="{{ app_description }}" />
    <title>{% block title %}{{ app_name }}{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', path='/css/base.css') }}" />
  </head>
  <body>
    <header class="site-header">
      <div class="container header-content">
        <a class="brand" href="/">{{ app_name }}</a>
        <nav class="site-nav" aria-label="Primary navigation">
          {% if current_user %}
            <a class="nav-link" href="/dashboard">Dashboard</a>
            <a class="nav-link" href="/factories">Factories</a>
            <a class="nav-link" href="/products">Products</a>
            <a class="nav-link" href="/batches">Batches</a>
            <a class="nav-link" href="/inspections">Inspections</a>
            <a class="nav-link" href="/defects">Defects</a>
            <a class="nav-link" href="/reports">Reports</a>
            <form class="global-search" action="/search" method="get"><input type="search" name="q" placeholder="Search all records" aria-label="Global search" value="{{ q|default('') }}"><button type="submit">Search</button></form>
            <a class="nav-link" href="/auth/profile">{{ current_user.username }}</a>
            <form class="nav-form" action="/auth/logout" method="post">
              <button class="nav-button" type="submit">Logout</button>
            </form>
          {% else %}
            <a class="nav-link" href="/auth/login">Login</a>
            <a class="nav-link nav-link-primary" href="/auth/register">Register</a>
          {% endif %}
        </nav>
      </div>
    </header>

    <main class="container page-content">
      {% block content %}{% endblock %}
    </main>

    <footer class="site-footer">
      <div class="container">
        <p>&copy; 2026 {{ app_name }}. Built for manufacturing quality teams.</p>
      </div>
    </footer>
  </body>
</html>
