{% extends "base.html" %}
{% block title %}{{ form_title }} | {{ app_name }}{% endblock %}
{% block content %}
<section class="auth-card" aria-labelledby="inspection-form-title"><p class="eyebrow">Quality Inspection</p><h1 id="inspection-form-title">{{ form_title }}</h1><p class="auth-copy">Inspector: {{ current_user.username }}</p><form class="auth-form" action="{{ form_action }}" method="post"><label for="batch_id">Batch</label><select id="batch_id" name="batch_id" required>{% for batch in batches %}<option value="{{ batch.id }}" {% if (inspection and inspection.batch_id == batch.id) or (selected_batch_id == batch.id) %}selected{% endif %}>{{ batch.batch_number }} — {{ batch.product.name }}</option>{% endfor %}</select><label for="scratch">Scratch</label><select id="scratch" name="scratch"><option value="pass" {% if inspection and inspection.scratch == 'pass' %}selected{% endif %}>Pass</option><option value="fail" {% if inspection and inspection.scratch == 'fail' %}selected{% endif %}>Fail</option></select><label for="color">Color</label><select id="color" name="color"><option value="pass" {% if inspection and inspection.color == 'pass' %}selected{% endif %}>Pass</option><option value="fail" {% if inspection and inspection.color == 'fail' %}selected{% endif %}>Fail</option></select><label for="weight_actual">Actual Weight</label><input id="weight_actual" name="weight_actual" type="number" step="0.01" min="0" value="{{ inspection.weight_actual if inspection else '' }}" required><label for="weight_spec">Spec Weight</label><input id="weight_spec" name="weight_spec" type="number" step="0.01" min="0.01" value="{{ inspection.weight_spec if inspection else '' }}" required><label for="dimensions_actual">Actual Dimensions</label><input id="dimensions_actual" name="dimensions_actual" maxlength="120" value="{{ inspection.dimensions_actual if inspection else '' }}" required><label for="dimensions_spec">Spec Dimensions</label><input id="dimensions_spec" name="dimensions_spec" maxlength="120" value="{{ inspection.dimensions_spec if inspection else '' }}" required><label for="packaging">Packaging</label><select id="packaging" name="packaging"><option value="pass" {% if inspection and inspection.packaging == 'pass' %}selected{% endif %}>Pass</option><option value="fail" {% if inspection and inspection.packaging == 'fail' %}selected{% endif %}>Fail</option></select><label for="functional_test">Functional Test</label><select id="functional_test" name="functional_test"><option value="pass" {% if inspection and inspection.functional_test == 'pass' %}selected{% endif %}>Pass</option><option value="fail" {% if inspection and inspection.functional_test == 'fail' %}selected{% endif %}>Fail</option></select><label for="overall_status">Overall Status Override</label><select id="overall_status" name="overall_status"><option value="">Auto-calculate</option>{% set selected_status = inspection.overall_status if inspection else '' %}<option value="Pass" {% if selected_status == 'Pass' %}selected{% endif %}>Pass</option><option value="Fail" {% if selected_status == 'Fail' %}selected{% endif %}>Fail</option></select><label for="remarks">Remarks / Override Justification</label><input id="remarks" name="remarks" maxlength="2000" value="{{ inspection.remarks if inspection else '' }}"><div class="form-actions"><button class="button" type="submit">Save Inspection</button><a class="button button-secondary" href="/inspections">Cancel</a></div></form></section>
{% endblock %}
