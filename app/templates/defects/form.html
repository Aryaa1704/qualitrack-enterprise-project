{% extends "base.html" %}
{% block title %}{{ form_title }} | {{ app_name }}{% endblock %}
{% block content %}<section class="auth-card" aria-labelledby="defect-form-title"><p class="eyebrow">Defect Tracking</p><h1 id="defect-form-title">{{ form_title }}</h1><p class="auth-copy">Inspection #{{ inspection.id }} · Batch {{ inspection.batch.batch_number }}</p><form class="auth-form" action="{{ form_action }}" method="post"><input type="hidden" name="inspection_id" value="{{ inspection.id }}"><label for="defect_type">Defect Type</label><select id="defect_type" name="defect_type" required>{% for item in defect_types %}<option value="{{ item }}" {% if defect and defect.defect_type == item %}selected{% endif %}>{{ item }}</option>{% endfor %}</select><label for="severity">Severity</label><select id="severity" name="severity" required>{% for item in severities %}<option value="{{ item }}" {% if defect and defect.severity == item %}selected{% endif %}>{{ item }}</option>{% endfor %}</select><label for="description">Description</label><textarea id="description" name="description" rows="4" required>{{ defect.description if defect else '' }}</textarea><label for="corrective_action">Corrective Action</label><textarea id="corrective_action" name="corrective_action" rows="4">{{ defect.corrective_action if defect else '' }}</textarea><label for="status">Status</label><select id="status" name="status" required>{% set selected_status = defect.status if defect else 'Open' %}{% for item in defect_statuses %}<option value="{{ item }}" {% if selected_status == item %}selected{% endif %}>{{ item }}</option>{% endfor %}</select><div class="form-actions"><button class="button" type="submit">Save Defect</button><a class="button button-secondary" href="/inspections/{{ inspection.id }}">Cancel</a></div></form></section>{% endblock %}
