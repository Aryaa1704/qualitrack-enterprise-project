{% extends "base.html" %}
{% block title %}{{ form_title }} | {{ app_name }}{% endblock %}
{% block content %}<section class="auth-card" aria-labelledby="product-form-title"><p class="eyebrow">Product Management</p><h1 id="product-form-title">{{ form_title }}</h1><form class="auth-form" action="{{ form_action }}" method="post"><label for="name">Name</label><input id="name" name="name" maxlength="120" value="{{ product.name if product else '' }}" required><label for="category">Category</label><input id="category" name="category" maxlength="80" value="{{ product.category if product else '' }}" required><label for="sku_code">SKU Code</label><input id="sku_code" name="sku_code" maxlength="50" value="{{ product.sku_code if product else '' }}" required><label for="status">Status</label><select id="status" name="status">{% set selected_status = product.status if product else 'active' %}<option value="active" {% if selected_status == 'active' %}selected{% endif %}>Active</option><option value="inactive" {% if selected_status == 'inactive' %}selected{% endif %}>Inactive</option></select><div class="form-actions"><button class="button" type="submit">Save Product</button><a class="button button-secondary" href="/products">Cancel</a></div></form></section>{% endblock %}
