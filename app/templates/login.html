{% extends "base.html" %}

{% block title %}Login | {{ app_name }}{% endblock %}

{% block content %}
<section class="auth-card" aria-labelledby="login-title">
  <p class="eyebrow">Welcome back</p>
  <h1 id="login-title">Log in to QualiTrack</h1>
  <p class="auth-copy">Use your username and password to access your profile.</p>
  <form class="auth-form" action="/auth/login" method="post">
    <label for="username">Username</label>
    <input id="username" name="username" type="text" autocomplete="username" required />

    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required />

    <button class="button" type="submit">Log in</button>
  </form>
  <p class="auth-switch">Need an account? <a href="/auth/register">Register</a>.</p>
</section>
{% endblock %}
