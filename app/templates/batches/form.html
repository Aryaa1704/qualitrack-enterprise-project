{% extends "base.html" %}
{% block title %}{{ form_title }} | {{ app_name }}{% endblock %}
{% block content %}<section class="auth-card" aria-labelledby="batch-form-title"><p class="eyebrow">Batch Management</p><h1 id="batch-form-title">{{ form_title }}</h1><form class="auth-form" action="{{ form_action }}" method="post"><label for="product_id">Product</label><select id="product_id" name="product_id" required>{% for product in products %}<option value="{{ product.id }}" {% if (batch and batch.product_id == product.id) or (selected_product_id == product.id) %}selected{% endif %}>{{ product.name }} ({{ product.sku_code }})</option>{% endfor %}</select><label for="production_line_id">Production Line</label><select id="production_line_id" name="production_line_id" required>{% for line in production_lines %}<option value="{{ line.id }}" {% if batch and batch.production_line_id == line.id %}selected{% endif %}>{{ line.name }}</option>{% endfor %}</select><label for="batch_number">Batch Number</label><input id="batch_number" name="batch_number" maxlength="50" value="{{ batch.batch_number if batch else '' }}" required><label for="manufacturing_date">Manufacturing Date</label><input id="manufacturing_date" name="manufacturing_date" type="date" value="{{ batch.manufacturing_date if batch else '' }}" required><label for="expiry_date">Expiry Date</label><input id="expiry_date" name="expiry_date" type="date" value="{{ batch.expiry_date if batch else '' }}" required><label for="quantity">Quantity</label><input id="quantity" name="quantity" type="number" min="1" value="{{ batch.quantity if batch else '' }}" required><label for="status">Status</label><select id="status" name="status">{% set selected_status = batch.status if batch else 'planned' %}{% for item in ['planned','in_progress','completed','expired','inactive'] %}<option value="{{ item }}" {% if selected_status == item %}selected{% endif %}>{{ item }}</option>{% endfor %}</select><div class="form-actions"><button class="button" type="submit">Save Batch</button><a class="button button-secondary" href="/batches">Cancel</a></div></form></section>{% endblock %}
